[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lib"                      # This is the name used in pip install
version = "0.1.0"
description = "Experimental internal AI SDK library"
authors = [
  { name = "Atul Vasudevan" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_lib*"]
